[project]
name = "forma-api"
version = "0.1.0"
description = "FORMA project API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi==2026.10.23",
    "fastapi==0.162.0",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "pydantic==2.14.2",
    "shapely==2.2.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/forma_api", "packages/domain/src/forma_domain", "packages/compiler/src/forma_compiler", "packages/renderer/src/forma_renderer", "packages/replanner/src/forma_replanner", "packages/fabrication/src/forma_fabrication", "packages/repair_search/src/forma_repair_search", "packages/eval/src/forma_eval", "packages/stability/src/forma_stability", "packages/synthesizer/src/forma_synthesizer", "packages/measurement/src/forma_measurement", "packages/photo_measure/src/forma_photo_measure"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/domain/tests", "packages/compiler/tests", "packages/renderer/tests", "packages/replanner/tests", "packages/fabrication/tests", "packages/repair_search/tests", "packages/eval/tests", "packages/stability/tests", "packages/synthesizer/tests", "packages/measurement/tests", "packages/photo_measure/tests", "tools/devloop/tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: requires explicit provider access; excluded from offline checks"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["forma_api", "forma_domain", "forma_eval"]

[tool.uv]
required-version = "==0.11.16"
