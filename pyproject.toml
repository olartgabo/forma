[project]
name = "forma-api"
version = "0.1.0"
description = "FORMA project API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/forma_api", "packages/domain/src/forma_domain", "packages/compiler/src/forma_compiler", "packages/replanner/src/forma_replanner"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/domain/tests", "packages/compiler/tests", "packages/replanner/tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: requires explicit provider access; excluded from offline checks"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["forma_api", "forma_domain"]

[tool.uv]
required-version = "==0.11.16"
